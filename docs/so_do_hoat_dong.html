<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      padding: 30px;
      color: #e2e8f0
    }

    .header {
      text-align: center;
      margin-bottom: 24px
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px
    }

    .header p {
      color: #94a3b8;
      font-size: 13px
    }

    .canvas-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      overflow-x: auto
    }

    canvas {
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4)
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4)
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12)
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15)
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Sơ đồ Hoạt động Tổng quan</h1>
    <p>Activity Diagram — Hệ thống Huế Travel</p>
  </div>
  <div class="canvas-wrapper">
    <canvas id="mainCanvas"></canvas>
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="dl(2)">⬇ Tải PNG (Chất lượng cao)</button>
    <button class="btn btn-secondary" onclick="dl(4)">⬇ Tải PNG @2x (In ấn)</button>
  </div>

  <script>
    const W = 1260, TH = 1620;
    const LANES = [
      { name: 'Người dùng (User)', x: 0, w: 420, color: '#3b82f6', bg: 'rgba(59,130,246,0.05)' },
      { name: 'Hệ thống (System)', x: 420, w: 420, color: '#10b981', bg: 'rgba(16,185,129,0.05)' },
      { name: 'Quản trị viên (Admin)', x: 840, w: 420, color: '#f59e0b', bg: 'rgba(245,158,11,0.05)' },
    ];

    // ── helpers ──
    function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath() }
    function dot(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill() }
    function dia(c, x, y, w, h, f, s) { c.fillStyle = f; c.strokeStyle = s; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, y - h / 2); c.lineTo(x + w / 2, y); c.lineTo(x, y + h / 2); c.lineTo(x - w / 2, y); c.closePath(); c.fill(); c.stroke() }
    function box(c, cx, cy, w, h, fill, text, fs) {
      const r = 10;
      c.fillStyle = 'rgba(0,0,0,0.07)'; rr(c, cx - w / 2 + 2, cy - h / 2 + 2, w, h, r); c.fill();
      c.fillStyle = fill; rr(c, cx - w / 2, cy - h / 2, w, h, r); c.fill();
      c.strokeStyle = adj(fill, -40); c.lineWidth = 1.2; rr(c, cx - w / 2, cy - h / 2, w, h, r); c.stroke();
      c.fillStyle = '#fff'; c.font = `600 ${fs || 11}px Inter,Arial,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      text.split('\n').forEach((l, i, a) => c.fillText(l, cx, cy + (i - (a.length - 1) / 2) * 15));
    }
    function arr(c, x1, y1, x2, y2, col, dash) {
      c.strokeStyle = col || '#64748b'; c.lineWidth = 1.5; c.setLineDash(dash ? [5, 3] : []);
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]);
      const a = Math.atan2(y2 - y1, x2 - x1), l = 7;
      c.fillStyle = col || '#64748b'; c.beginPath(); c.moveTo(x2, y2);
      c.lineTo(x2 - l * Math.cos(a - .4), y2 - l * Math.sin(a - .4));
      c.lineTo(x2 - l * Math.cos(a + .4), y2 - l * Math.sin(a + .4)); c.closePath(); c.fill();
    }
    function arrB(c, x1, y1, mx, my, x2, y2, col) {
      c.strokeStyle = col || '#64748b'; c.lineWidth = 1.5; c.setLineDash([]);
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(mx, my); c.lineTo(x2, y2); c.stroke();
      const a = Math.atan2(y2 - my, x2 - mx), l = 7;
      c.fillStyle = col || '#64748b'; c.beginPath(); c.moveTo(x2, y2);
      c.lineTo(x2 - l * Math.cos(a - .4), y2 - l * Math.sin(a - .4));
      c.lineTo(x2 - l * Math.cos(a + .4), y2 - l * Math.sin(a + .4)); c.closePath(); c.fill();
    }
    function lbl(c, x, y, t, col, sz) { c.fillStyle = col || '#64748b'; c.font = `${sz || 10}px Inter,Arial,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t, x, y) }
    function adj(h, a) { let r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16); r = Math.max(0, Math.min(255, r + a)); g = Math.max(0, Math.min(255, g + a)); b = Math.max(0, Math.min(255, b + a)); return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('') }

    // ── main draw ──
    function draw(canvas, scale) {
      canvas.width = W * scale; canvas.height = TH * scale;
      const c = canvas.getContext('2d'); c.scale(scale, scale);
      c.fillStyle = '#fff'; c.fillRect(0, 0, W, TH);

      // title
      c.fillStyle = '#1e293b'; c.font = 'bold 20px Inter,Arial,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('Sơ đồ Hoạt động Tổng quan — Hệ thống Huế Travel AI', W / 2, 28);

      // swimlanes
      const LT = 50, LH = TH - 85;
      LANES.forEach(l => {
        c.fillStyle = l.bg; c.fillRect(l.x, LT, l.w, LH);
        c.strokeStyle = 'rgba(100,116,139,0.18)'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(l.x + l.w, LT); c.lineTo(l.x + l.w, LT + LH); c.stroke();
        c.fillStyle = l.color; c.globalAlpha = 0.10; c.fillRect(l.x, LT, l.w, 36); c.globalAlpha = 1;
        c.fillStyle = l.color; c.font = 'bold 13px Inter,Arial,sans-serif'; c.textAlign = 'center';
        c.fillText(l.name, l.x + l.w / 2, LT + 20);
      });
      c.strokeStyle = '#cbd5e1'; c.lineWidth = 1.5; c.strokeRect(0, LT, W, LH);

      // lane centers
      const U = 210, S = 630, A = 1050;
      let Y;

      // ═══════════════════ USER: START ═══════════════════
      Y = 110;
      dot(c, U, Y, 12, '#1e293b');
      c.fillStyle = '#fff'; c.font = 'bold 10px Inter'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('S', U, Y);

      Y += 40;
      box(c, U, Y, 210, 36, '#3b82f6', 'Truy cập hệ thống');
      arr(c, U, 110 + 12, U, Y - 18);

      // ── D1: Đã có tài khoản? ──
      Y += 50;
      dia(c, U, Y, 150, 50, '#e0f2fe', '#3b82f6');
      lbl(c, U, Y, 'Đã có tài khoản?', '#1e40af', 11);
      arr(c, U, Y - 50 + 18, U, Y - 25);

      const d1y = Y;
      // NO → Đăng ký (bên trái)
      box(c, U - 160, d1y, 140, 32, '#60a5fa', 'Đăng ký (UC01)');
      arr(c, U - 75, d1y, U - 160 + 70, d1y);
      lbl(c, U - 110, d1y - 15, 'Không', '#1e40af', 10);

      // YES → Đăng nhập
      Y += 65;
      box(c, U, Y, 210, 36, '#3b82f6', 'Đăng nhập (UC02)');
      arr(c, U, d1y + 25, U, Y - 18);
      lbl(c, U + 15, d1y + 40, 'Có', '#1e40af', 10);
      // Đăng ký → Đăng nhập
      arrB(c, U - 160, d1y + 16, U - 160, Y, U - 105, Y, '#94a3b8');

      // ── SYSTEM: Xác thực ──
      Y += 55;
      box(c, S, Y, 240, 40, '#10b981', 'Xác thực & Tạo session\n(Flask-Login)');
      arr(c, U + 105, Y - 55, S - 120, Y);

      // D2: Thành công?
      Y += 60;
      dia(c, S, Y, 150, 50, '#d1fae5', '#10b981');
      lbl(c, S, Y, 'Xác thực\nthành công?', '#065f46', 10);
      arr(c, S, Y - 60 + 20, S, Y - 25);

      const d2y = Y;
      // NO → Lỗi quay lại
      lbl(c, S + 90, d2y - 10, 'Không', '#065f46', 10);
      arrB(c, S + 75, d2y, S + 170, d2y, S + 170, d2y - 120, '#ef4444');
      arrB(c, S + 170, d2y - 120, U + 105, d2y - 120, U + 105, d2y - 120 - 20, '#ef4444');
      lbl(c, S + 175, d2y - 70, 'Lỗi', '#ef4444', 9);

      // YES → D3: Kiểm tra Role
      Y += 65;
      dia(c, S, Y, 150, 50, '#d1fae5', '#10b981');
      lbl(c, S, Y, 'Kiểm tra Role?', '#065f46', 11);
      arr(c, S, d2y + 25, S, Y - 25);
      lbl(c, S + 15, d2y + 40, 'Có', '#065f46', 10);

      const d3y = Y;

      // Role=User → Xem bản đồ
      Y += 65;
      box(c, U, Y, 210, 40, '#3b82f6', 'Xem bản đồ tương tác\n(UC06)');
      arrB(c, S - 75, d3y, U + 105, d3y + 35, U + 105, Y - 20, '#64748b');
      lbl(c, U + 140, d3y + 15, 'User', '#1e40af', 10);

      // Role=Admin → Dashboard
      box(c, A, Y, 210, 40, '#f59e0b', 'Truy cập Dashboard\nQuản trị');
      arrB(c, S + 75, d3y, A - 105, d3y + 35, A - 105, Y - 20, '#64748b');
      lbl(c, A - 140, d3y + 15, 'Admin', '#92400e', 10);

      // ═══════════════ USER FLOW ═══════════════
      Y += 60;
      // D4: Chọn hành động
      dia(c, U, Y, 170, 55, '#e0f2fe', '#3b82f6');
      lbl(c, U, Y, 'Chọn hành động?', '#1e40af', 11);
      arr(c, U, Y - 60 + 20, U, Y - 27);

      const d4y = Y;

      // ── Nhánh 1: Xem chi tiết (trái) ──
      let b1y = d4y + 70;
      box(c, U - 90, b1y, 170, 36, '#3b82f6', 'Xem chi tiết\nđịa điểm (UC07)');
      arrB(c, U - 85, d4y + 20, U - 90, d4y + 45, U - 90, b1y - 18, '#64748b');

      // D: Like / Đánh giá?
      b1y += 55;
      dia(c, U - 90, b1y, 140, 44, '#e0f2fe', '#3b82f6');
      lbl(c, U - 90, b1y, 'Like / Đánh giá?', '#1e40af', 10);
      arr(c, U - 90, b1y - 55 + 18, U - 90, b1y - 22);

      // Like
      const likeY = b1y + 60;
      box(c, U - 165, likeY, 120, 32, '#60a5fa', 'Like (UC08)');
      arrB(c, U - 90 - 50, b1y + 22, U - 165, b1y + 40, U - 165, likeY - 16, '#64748b');
      lbl(c, U - 175, b1y + 30, 'Like', '#1e40af', 9);

      // Review
      box(c, U - 10, likeY, 130, 32, '#60a5fa', 'Đánh giá (UC09)');
      arrB(c, U - 90 + 50, b1y + 22, U - 10, b1y + 40, U - 10, likeY - 16, '#64748b');
      lbl(c, U + 10, b1y + 30, 'Review', '#1e40af', 9);

      // → System: Lưu Neo4j
      const sysLikeY = likeY + 65;
      box(c, S - 100, sysLikeY, 200, 40, '#10b981', 'Lưu :LIKED / :REVIEWED\nvào Neo4j + NLP', 10);
      arr(c, U - 165 + 60, likeY + 16, S - 100 - 100, sysLikeY - 12, '#64748b');
      arr(c, U - 10 + 65, likeY + 16, S - 100 - 100, sysLikeY + 5, '#64748b');

      // → Cập nhật INTERACTED
      const intY = sysLikeY + 60;
      box(c, S - 100, intY, 200, 36, '#059669', 'Cập nhật :INTERACTED\n(weight tự động)', 10);
      arr(c, S - 100, sysLikeY + 20, S - 100, intY - 18);

      // ── Nhánh 2: Gợi ý AI (phải) ──
      let b2y = d4y + 70;
      box(c, U + 120, b2y, 150, 36, '#3b82f6', 'Xem Gợi ý AI\n(UC10)');
      arrB(c, U + 85, d4y + 20, U + 120, d4y + 45, U + 120, b2y - 18, '#64748b');

      // → System: Hybrid (đặt DƯỚI intY để không chồng)
      const hybY = intY + 75;
      box(c, S, hybY, 260, 65, '#10b981', 'Thuật toán Hybrid Recommendation\n① Collaborative Filtering (×4.0)\n② Content-Based Filtering (×3.0)\n③ PageRank Diversity Pool (×10.0)');
      arr(c, U + 120 + 75, b2y + 10, S - 130, hybY - 25, '#64748b');

      // → Tính điểm
      const scoreY = hybY + 65;
      box(c, S, scoreY, 230, 36, '#059669', 'Tính Final Score\n+ Explainable AI');
      arr(c, S, hybY + 33, S, scoreY - 18);

      // → Trả về User
      const resY = scoreY + 55;
      box(c, U + 120, resY, 170, 36, '#3b82f6', 'Hiển thị Top 12\ngợi ý + biểu đồ');
      arrB(c, S - 115, scoreY + 12, U + 120 + 85, scoreY + 35, U + 120, resY - 18, '#64748b');

      // ── Nhánh 3: Lộ trình ──
      const b3y = resY + 60;
      box(c, U, b3y, 190, 36, '#3b82f6', 'Lập lộ trình (UC11)');
      lbl(c, U + 5, d4y + 32, 'Lộ trình', '#1e40af', 9);
      arr(c, U, d4y + 27, U, b3y - 18, '#94a3b8', true);

      // → System: Greedy
      const planSysY = b3y + 5;
      box(c, S, planSysY, 250, 40, '#10b981', 'Greedy Nearest Neighbor\n(Haversine) → Timeline');
      arr(c, U + 95, b3y, S - 125, planSysY);

      // → Lưu lộ trình
      const saveY = b3y + 60;
      box(c, U, saveY, 190, 36, '#3b82f6', 'Lưu lộ trình (UC12)');
      arrB(c, S - 125, planSysY + 12, U + 95, planSysY + 35, U, saveY - 18, '#64748b');

      // → System: Tạo Itinerary
      const saveSysY = saveY + 5;
      box(c, S, saveSysY, 230, 36, '#10b981', 'Tạo :Itinerary node\n+ :CREATED relationship');
      arr(c, U + 95, saveY, S - 115, saveSysY);

      // ── Xem lịch sử ──
      const histY = saveY + 65;
      box(c, U, histY, 190, 36, '#8b5cf6', 'Xem lịch sử (UC13)');
      arr(c, U, saveY + 18, U, histY - 18, '#94a3b8');

      // ═══════════════ ADMIN FLOW ═══════════════
      const admDY = Y + 60; // Y is still at the "Xem bản đồ" row
      dia(c, A, admDY, 170, 55, '#fef3c7', '#f59e0b');
      lbl(c, A, admDY, 'Chọn hành động\nquản trị?', '#92400e', 10);
      arr(c, A, Y + 20, A, admDY - 27);

      // Admin: Quản lý user
      const au1 = admDY + 65;
      box(c, A - 110, au1, 160, 36, '#f59e0b', 'Quản lý người dùng\n(UC14)');
      arrB(c, A - 85, admDY + 22, A - 110, admDY + 42, A - 110, au1 - 18, '#64748b');

      // Admin: CRUD địa điểm
      box(c, A + 110, au1, 160, 36, '#f59e0b', 'CRUD Địa điểm\n(UC15-17)');
      arrB(c, A + 85, admDY + 22, A + 110, admDY + 42, A + 110, au1 - 18, '#64748b');

      // → System: CRUD Neo4j
      const admSysY = au1 + 60;
      box(c, S + 100, admSysY, 200, 40, '#10b981', 'CRUD Neo4j +\nĐồng bộ Excel', 10);
      arr(c, A - 110, au1 + 18, S + 100 + 100, admSysY - 12, '#64748b');
      arr(c, A + 110, au1 + 18, S + 100 + 100, admSysY + 5, '#64748b');

      // Admin: Chạy AI
      const au3 = admSysY + 70;
      box(c, A, au3, 190, 36, '#ef4444', 'Chạy thuật toán AI\n(UC18)');
      arr(c, A, admDY + 27, A, au3 - 18, '#94a3b8', true);
      lbl(c, A + 18, admDY + 42, 'AI', '#92400e', 9);

      // → System: Run algo
      const algoSysY = au3 + 5;
      box(c, S + 100, algoSysY, 200, 50, '#10b981', 'PageRank + Node Similarity\n→ Cập nhật :SIMILAR_TO,\n:LOC_SIMILAR', 10);
      arr(c, A - 95, au3, S + 100 + 100, algoSysY - 18, '#64748b');

      // → Admin: Kết quả
      const admResY = au3 + 65;
      box(c, A, admResY, 190, 36, '#f59e0b', 'Xem kết quả thống kê');
      arrB(c, S + 100, algoSysY + 25, A - 95, admResY - 5, A - 95, admResY, '#64748b');

      // ═══════════════ MERGE & END ═══════════════
      const mergeY = Math.max(histY + 65, admResY + 65);
      c.fillStyle = '#1e293b'; rr(c, W / 2 - 220, mergeY, 440, 6, 3); c.fill();
      arr(c, U, histY + 18, U, mergeY, '#94a3b8');
      arr(c, A, admResY + 18, A, mergeY, '#94a3b8');
      lbl(c, U + 20, histY + 40, 'Đăng xuất (UC03)', '#64748b', 9);

      const endY = mergeY + 45;
      dot(c, W / 2, endY, 14, '#1e293b');
      dot(c, W / 2, endY, 8, '#fff');
      dot(c, W / 2, endY, 5, '#1e293b');
      lbl(c, W / 2, endY + 25, 'Kết thúc', '#475569', 12);
      arr(c, W / 2, mergeY + 6, W / 2, endY - 14, '#1e293b');

      // footer
      c.fillStyle = '#94a3b8'; c.font = '10px Inter,Arial,sans-serif'; c.textAlign = 'center';
      c.fillText('Sơ đồ Hoạt động Tổng quan — Biểu diễn luồng xử lý chính giữa 3 swimlane: Người dùng, Hệ thống, Quản trị viên', W / 2, TH - 18);
    }

    function dl(s) { const c = document.createElement('canvas'); draw(c, s); const a = document.createElement('a'); a.download = 'So_Do_Hoat_Dong_' + s + 'x.png'; a.href = c.toDataURL('image/png'); a.click() }
    window.onload = () => draw(document.getElementById('mainCanvas'), 1);
  </script>
</body>

</html>

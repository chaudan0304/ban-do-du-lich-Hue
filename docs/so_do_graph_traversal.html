<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ đồ Graph Traversal — Collaborative Filtering trên Graph Database</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h2 {
            color: #0056b3;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 0;
        }

        canvas {
            border: 1px solid #e0e0e0;
            background-color: #fff;
        }

        .btn-download {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }

        .btn-download:hover {
            background-color: #1557b0;
        }

        .legend {
            margin-top: 15px;
            font-size: 13px;
            color: #555;
            text-align: left;
            display: inline-block;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 4px 0;
        }

        .legend-swatch {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="canvas" width="1000" height="560"></canvas>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-swatch" style="background:#E3F2FD; border-color:#1565C0;"></div>
                <span><strong>User</strong> — Người dùng trong hệ thống</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#E8F5E9; border-color:#2E7D32;"></div>
                <span><strong>Location</strong> — Địa điểm du lịch</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#FFF3E0; border-color:#E65100;"></div>
                <span><strong>Location MỚI</strong> — Địa điểm gợi ý (chưa tương tác)</span>
            </div>
        </div>
    </div>
    <br>
    <button class="btn-download" onclick="downloadPNG()">⬇ Tải ảnh PNG</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // ─── Color Palette ───
        const COLORS = {
            userFill: '#E3F2FD',
            userStroke: '#1565C0',
            userText: '#0D47A1',
            locFill: '#E8F5E9',
            locStroke: '#2E7D32',
            locText: '#1B5E20',
            newLocFill: '#FFF3E0',
            newLocStroke: '#E65100',
            newLocText: '#BF360C',
            edgeSolid: '#546E7A',
            edgeDashed: '#FF6F00',
            edgeSimilar: '#7B1FA2',
            hopLabel: '#FFFFFF',
            hopBg1: '#1565C0',
            hopBg2: '#7B1FA2',
            hopBg3: '#E65100',
            resultBg: '#C8E6C9',
            resultBorder: '#388E3C',
            resultText: '#1B5E20',
        };

        // ─── Node positions ───
        const nodes = {
            userA: { x: 120, y: 200, label: 'User A\n(hiện tại)', type: 'user' },
            loc1: { x: 400, y: 120, label: 'Đại Nội\nHuế', type: 'location' },
            loc2: { x: 400, y: 320, label: 'Chùa\nThiên Mụ', type: 'location' },
            userB: { x: 650, y: 120, label: 'User B\n(tương đồng)', type: 'similarUser' },
            userC: { x: 650, y: 320, label: 'User C\n(tương đồng)', type: 'similarUser' },
            newLoc1: { x: 880, y: 180, label: 'Lăng\nTự Đức', type: 'newLocation' },
            newLoc2: { x: 880, y: 340, label: 'Lăng\nKhải Định', type: 'newLocation' },
        };

        // ─── Helper: Draw rounded rectangle ───
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ─── Helper: Draw node ───
        function drawNode(node) {
            const { x, y, label, type } = node;
            const w = 120, h = 58, r = 12;

            let fill, stroke, textColor;
            if (type === 'user') {
                fill = COLORS.userFill; stroke = COLORS.userStroke; textColor = COLORS.userText;
            } else if (type === 'similarUser') {
                fill = COLORS.userFill; stroke = COLORS.edgeSimilar; textColor = COLORS.userText;
            } else if (type === 'location') {
                fill = COLORS.locFill; stroke = COLORS.locStroke; textColor = COLORS.locText;
            } else {
                fill = COLORS.newLocFill; stroke = COLORS.newLocStroke; textColor = COLORS.newLocText;
            }

            // Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.12)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 3;

            roundRect(x - w / 2, y - h / 2, w, h, r);
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            ctx.strokeStyle = stroke;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Type badge
            ctx.font = 'bold 9px "Segoe UI", sans-serif';
            const badge = type === 'newLocation' ? ':Location' : type.includes('user') || type.includes('User') ? ':User' : ':Location';
            const badgeW = ctx.measureText(badge).width + 10;
            const badgeH = 16;
            const badgeX = x - badgeW / 2;
            const badgeY = y - h / 2 - badgeH / 2;

            roundRect(badgeX, badgeY, badgeW, badgeH, 4);
            ctx.fillStyle = stroke;
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(badge, x, badgeY + badgeH / 2);

            // Label text (multiline)
            ctx.fillStyle = textColor;
            ctx.font = '12px "Segoe UI", sans-serif';
            const lines = label.split('\n');
            const lineH = 15;
            const startY = y - ((lines.length - 1) * lineH) / 2 + 3;
            lines.forEach((line, i) => {
                ctx.font = i === 0 ? 'bold 12px "Segoe UI", sans-serif' : '11px "Segoe UI", sans-serif';
                ctx.fillText(line, x, startY + i * lineH);
            });
        }

        // ─── Helper: Draw arrow ───
        function drawArrow(fromNode, toNode, label, style = 'solid', color = COLORS.edgeSolid) {
            const dx = toNode.x - fromNode.x;
            const dy = toNode.y - fromNode.y;
            const angle = Math.atan2(dy, dx);
            const nodeW = 60, nodeH = 29;

            // Calculate intersection with node boundary
            const startX = fromNode.x + Math.cos(angle) * nodeW;
            const startY = fromNode.y + Math.sin(angle) * nodeH;
            const endX = toNode.x - Math.cos(angle) * nodeW;
            const endY = toNode.y - Math.sin(angle) * nodeH;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;

            if (style === 'dashed') {
                ctx.setLineDash([6, 4]);
            } else {
                ctx.setLineDash([]);
            }

            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Arrowhead
            const headLen = 10;
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headLen * Math.cos(angle - 0.35), endY - headLen * Math.sin(angle - 0.35));
            ctx.lineTo(endX - headLen * Math.cos(angle + 0.35), endY - headLen * Math.sin(angle + 0.35));
            ctx.closePath();
            ctx.fill();

            // Label
            if (label) {
                const midX = (startX + endX) / 2;
                const midY = (startY + endY) / 2;
                ctx.font = '10px "Segoe UI", sans-serif';
                const tw = ctx.measureText(label).width + 8;
                const th = 16;

                roundRect(midX - tw / 2, midY - th / 2 - 6, tw, th, 3);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = color;
                ctx.font = 'bold 10px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, midX, midY - 6);
            }
        }

        // ─── Helper: Draw hop badge ───
        function drawHopBadge(x, y, text, bgColor) {
            ctx.font = 'bold 11px "Segoe UI", sans-serif';
            const tw = ctx.measureText(text).width + 14;
            const th = 22;

            roundRect(x - tw / 2, y - th / 2, tw, th, 5);
            ctx.fillStyle = bgColor;
            ctx.fill();

            ctx.fillStyle = COLORS.hopLabel;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        // ─── Main draw ───
        function draw() {
            // Clear
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ─── Draw edges ───
            // Hop 1: User A → Location chung
            drawArrow(nodes.userA, nodes.loc1, ':INTERACTED', 'solid', COLORS.edgeSolid);
            drawArrow(nodes.userA, nodes.loc2, ':INTERACTED', 'solid', COLORS.edgeSolid);

            // Hop 2: Location chung ← User tương đồng
            drawArrow(nodes.userB, nodes.loc1, ':INTERACTED', 'solid', COLORS.edgeSimilar);
            drawArrow(nodes.userC, nodes.loc2, ':INTERACTED', 'solid', COLORS.edgeSimilar);
            drawArrow(nodes.userC, nodes.loc1, ':INTERACTED', 'solid', COLORS.edgeSimilar);

            // Hop 3: User tương đồng → Location MỚI
            drawArrow(nodes.userB, nodes.newLoc1, ':INTERACTED', 'dashed', COLORS.edgeDashed);
            drawArrow(nodes.userC, nodes.newLoc2, ':INTERACTED', 'dashed', COLORS.edgeDashed);

            // ─── Draw nodes ───
            Object.values(nodes).forEach(drawNode);

            // ─── Draw hop badges ───
            drawHopBadge(240, 75, 'Bước 1: Tìm Location chung', COLORS.hopBg1);
            drawHopBadge(540, 75, 'Bước 2: Tìm User tương đồng', COLORS.hopBg2);
            drawHopBadge(840, 75, 'Bước 3: Lấy Location MỚI', COLORS.hopBg3);





        }

        draw();

        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'So_do_Graph_Traversal_CF.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ Chức năng - Huế Travel AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      padding: 30px;
      color: #e2e8f0;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .canvas-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    canvas {
      border-radius: 12px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    .legend {
      max-width: 900px;
      margin: 30px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.05);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Sơ đồ Chức năng Tổng quan</h1>
    <p>Hệ thống Huế Travel AI — 2 Tác nhân, 18 Use Case, 5 Nhóm chức năng</p>
  </div>

  <div class="canvas-wrapper">
    <canvas id="mainCanvas" width="1100" height="1180"></canvas>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="downloadPNG()">⬇ Tải ảnh PNG (Chất lượng cao)</button>
    <button class="btn btn-secondary" onclick="downloadPNG2x()">⬇ Tải PNG @2x (In ấn)</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background:#3b82f6"></div>Nhóm Xác thực</div>
    <div class="legend-item"><div class="legend-color" style="background:#10b981"></div>Nhóm Bản đồ & Tương tác</div>
    <div class="legend-item"><div class="legend-color" style="background:#f59e0b"></div>Nhóm AI & Lộ trình</div>
    <div class="legend-item"><div class="legend-color" style="background:#8b5cf6"></div>Nhóm Lịch sử</div>
    <div class="legend-item"><div class="legend-color" style="background:#ef4444"></div>Nhóm Quản trị (Admin)</div>
    <div class="legend-item"><div class="legend-color" style="background:transparent; border:2px dashed #94a3b8"></div>Mũi tên nét đứt = Kế thừa</div>
  </div>

<script>
// ============================================================
// DATA
// ============================================================
const groups = [
  {
    name: 'Xác thực & Tài khoản',
    color: '#3b82f6',
    colorLight: 'rgba(59,130,246,0.12)',
    items: [
      { id: 'UC01', name: 'Đăng ký tài khoản' },
      { id: 'UC02', name: 'Đăng nhập' },
      { id: 'UC03', name: 'Đăng xuất' },
      { id: 'UC04', name: 'Quên mật khẩu' },
      { id: 'UC05', name: 'Cập nhật hồ sơ' },
    ]
  },
  {
    name: 'Bản đồ & Tương tác',
    color: '#10b981',
    colorLight: 'rgba(16,185,129,0.12)',
    items: [
      { id: 'UC06', name: 'Xem bản đồ' },
      { id: 'UC07', name: 'Xem chi tiết địa điểm' },
      { id: 'UC08', name: 'Like địa điểm' },
      { id: 'UC09', name: 'Viết đánh giá' },
    ]
  },
  {
    name: 'AI & Lộ trình',
    color: '#f59e0b',
    colorLight: 'rgba(245,158,11,0.12)',
    items: [
      { id: 'UC10', name: 'Xem gợi ý AI' },
      { id: 'UC11', name: 'Sắp xếp lộ trình' },
      { id: 'UC12', name: 'Lưu lộ trình' },
    ]
  },
  {
    name: 'Lịch sử',
    color: '#8b5cf6',
    colorLight: 'rgba(139,92,246,0.12)',
    items: [
      { id: 'UC13', name: 'Xem lịch sử' },
    ]
  },
  {
    name: 'Quản trị hệ thống',
    color: '#ef4444',
    colorLight: 'rgba(239,68,68,0.12)',
    items: [
      { id: 'UC14', name: 'Quản lý người dùng' },
      { id: 'UC15', name: 'Thêm địa điểm' },
      { id: 'UC16', name: 'Sửa địa điểm' },
      { id: 'UC17', name: 'Xóa địa điểm' },
      { id: 'UC18', name: 'Chạy thuật toán AI' },
    ]
  },
];

// Include relationships
const includes = [
  { from: 'UC08', to: 'UC07', label: '<<include>>' },
  { from: 'UC09', to: 'UC07', label: '<<include>>' },
  { from: 'UC12', to: 'UC11', label: '<<include>>' },
];

// ============================================================
// DRAWING
// ============================================================
function draw(canvas, scale) {
  const W = 1100, H = 1180;
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#1e293b';
  ctx.font = 'bold 22px Inter, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Biểu đồ Use Case Tổng Quan — Hệ thống Huế Travel AI', W / 2, 32);

  // System boundary
  const sysX = 200, sysY = 55, sysW = 700, sysH = 1070;
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  roundRect(ctx, sysX, sysY, sysW, sysH, 12);
  ctx.stroke();

  ctx.fillStyle = '#f8fafc';
  roundRect(ctx, sysX, sysY, sysW, sysH, 12);
  ctx.fill();
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2;
  roundRect(ctx, sysX, sysY, sysW, sysH, 12);
  ctx.stroke();

  ctx.fillStyle = '#334155';
  ctx.font = 'bold 16px Inter, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Hệ thống Huế Travel AI', sysX + sysW / 2, sysY + 22);

  // Store oval positions for line drawing
  const ovalPositions = {};

  // Draw groups & ovals
  let groupY = sysY + 42;
  const groupPadX = 18;
  const ovalRX = 95, ovalRY = 20;

  groups.forEach((g, gi) => {
    const isAdmin = gi === 4;
    const itemCount = g.items.length;
    const groupH = itemCount * 44 + 30;
    const gx = sysX + groupPadX;
    const gw = sysW - groupPadX * 2;

    // Group background
    ctx.fillStyle = g.colorLight;
    roundRect(ctx, gx, groupY, gw, groupH, 8);
    ctx.fill();
    ctx.strokeStyle = g.color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    roundRect(ctx, gx, groupY, gw, groupH, 8);
    ctx.stroke();

    // Group label
    ctx.fillStyle = g.color;
    ctx.font = 'bold 12px Inter, Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('« ' + g.name + ' »', gx + 12, groupY + 18);

    // Ovals
    g.items.forEach((item, ii) => {
      const oy = groupY + 38 + ii * 44;
      let ox;
      if (isAdmin) {
        ox = sysX + sysW / 2 + 100;
      } else {
        ox = sysX + sysW / 2 - 80;
      }

      ovalPositions[item.id] = { x: ox, y: oy };

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.beginPath();
      ctx.ellipse(ox + 2, oy + 2, ovalRX, ovalRY, 0, 0, Math.PI * 2);
      ctx.fill();

      // Oval fill gradient
      const grad = ctx.createLinearGradient(ox - ovalRX, oy - ovalRY, ox + ovalRX, oy + ovalRY);
      grad.addColorStop(0, g.color);
      grad.addColorStop(1, adjustColor(g.color, -30));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(ox, oy, ovalRX, ovalRY, 0, 0, Math.PI * 2);
      ctx.fill();

      // Oval border
      ctx.strokeStyle = adjustColor(g.color, -50);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(ox, oy, ovalRX, ovalRY, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Text
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 11px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.id + ' – ' + item.name, ox, oy);
    });

    groupY += groupH + 10;
  });

  // Draw Actors
  const userX = 80, userY = 550;
  const adminX = 1020, adminY = 550;

  drawActor(ctx, userX, userY, 'Người dùng', '(User)');
  drawActor(ctx, adminX, adminY, 'Quản trị viên', '(Admin)');

  // Draw Generalization arrow (Admin --> User) - dashed
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.8;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(adminX - 30, adminY - 20);
  ctx.lineTo(adminX - 80, adminY - 60);
  ctx.stroke();
  ctx.setLineDash([]);

  // Arrowhead (hollow triangle for generalization)
  const gAx = adminX - 80, gAy = adminY - 60;
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.8;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(gAx, gAy);
  ctx.lineTo(gAx + 8, gAy + 14);
  ctx.lineTo(gAx - 8, gAy + 14);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Label
  ctx.fillStyle = '#64748b';
  ctx.font = 'italic 10px Inter, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('<<kế thừa>>', adminX - 55, adminY - 65);

  // Extended generalization line to system boundary
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(adminX - 80, adminY - 60);
  ctx.lineTo(sysX + sysW - 20, sysY + 100);
  ctx.stroke();
  ctx.setLineDash([]);

  // User association lines to non-admin UCs
  ctx.setLineDash([]);
  groups.forEach((g, gi) => {
    if (gi === 4) return; // skip admin group
    g.items.forEach(item => {
      const pos = ovalPositions[item.id];
      ctx.strokeStyle = 'rgba(100,116,139,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(userX + 25, userY);
      ctx.lineTo(pos.x - ovalRX, pos.y);
      ctx.stroke();
    });
  });

  // Admin association lines to admin UCs
  groups.forEach((g, gi) => {
    if (gi !== 4) return;
    g.items.forEach(item => {
      const pos = ovalPositions[item.id];
      ctx.strokeStyle = 'rgba(100,116,139,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(adminX - 25, adminY);
      ctx.lineTo(pos.x + ovalRX, pos.y);
      ctx.stroke();
    });
  });

  // Draw <<include>> relationships
  includes.forEach(inc => {
    const fromPos = ovalPositions[inc.from];
    const toPos = ovalPositions[inc.to];
    if (!fromPos || !toPos) return;

    // Determine direction
    const dx = toPos.x - fromPos.x;
    const dy = toPos.y - fromPos.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const nx = dx / dist, ny = dy / dist;

    const startX = fromPos.x + nx * ovalRX;
    const startY = fromPos.y + ny * ovalRY;
    const endX = toPos.x - nx * ovalRX;
    const endY = toPos.y - ny * ovalRY;

    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrowhead
    const aLen = 8;
    const angle = Math.atan2(endY - startY, endX - startX);
    ctx.fillStyle = '#64748b';
    ctx.beginPath();
    ctx.moveTo(endX, endY);
    ctx.lineTo(endX - aLen * Math.cos(angle - 0.4), endY - aLen * Math.sin(angle - 0.4));
    ctx.lineTo(endX - aLen * Math.cos(angle + 0.4), endY - aLen * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fill();

    // Label
    const midX = (startX + endX) / 2;
    const midY = (startY + endY) / 2;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(midX - 28, midY - 8, 56, 14);
    ctx.fillStyle = '#64748b';
    ctx.font = 'italic 9px Inter, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(inc.label, midX, midY);
  });

  // Footer
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px Inter, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Ghi chú: Admin kế thừa toàn bộ chức năng của User (UC01–UC13), đồng thời có thêm các chức năng quản trị (UC14–UC18)', W / 2, H - 15);
}

// ============================================================
// HELPERS
// ============================================================
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawActor(ctx, x, y, name, sub) {
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2.5;
  ctx.fillStyle = '#334155';

  // Head
  ctx.beginPath();
  ctx.arc(x, y - 45, 14, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(x, y - 31);
  ctx.lineTo(x, y + 10);
  ctx.stroke();

  // Arms
  ctx.beginPath();
  ctx.moveTo(x - 18, y - 12);
  ctx.lineTo(x + 18, y - 12);
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(x, y + 10);
  ctx.lineTo(x - 16, y + 38);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y + 10);
  ctx.lineTo(x + 16, y + 38);
  ctx.stroke();

  // Label
  ctx.font = 'bold 13px Inter, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(name, x, y + 44);
  ctx.font = '11px Inter, Arial, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText(sub, x, y + 61);
}

function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
}

// ============================================================
// DOWNLOAD
// ============================================================
function downloadPNG() {
  const c = document.createElement('canvas');
  draw(c, 2);
  const link = document.createElement('a');
  link.download = 'So_Do_Chuc_Nang_Tong_Quan.png';
  link.href = c.toDataURL('image/png');
  link.click();
}

function downloadPNG2x() {
  const c = document.createElement('canvas');
  draw(c, 4);
  const link = document.createElement('a');
  link.download = 'So_Do_Chuc_Nang_Tong_Quan_2x.png';
  link.href = c.toDataURL('image/png');
  link.click();
}

// ============================================================
// INIT
// ============================================================
window.onload = function () {
  const canvas = document.getElementById('mainCanvas');
  draw(canvas, 1);
};
</script>
</body>
</html>

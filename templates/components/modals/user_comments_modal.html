<!-- ======================================================================
     MODAL XEM BÌNH LUẬN NGƯỜI DÙNG / USER COMMENTS MODAL
     
     Mô tả / Description:
     Modal hiển thị lịch sử tất cả bình luận của một người dùng cụ thể.
     Dùng bởi admin để xem đánh giá của từng user.
     Modal showing all comments history of a specific user.
     Used by admin to view reviews from individual users.
     
     Hàm JS liên quan / Related JS functions:
     - openUserCommentsModal(), closeUserCommentsModal() → admin.js
     ====================================================================== -->
  <div id="userCommentsModal" class="modal">
    <div class="modal-content-fancy" style="max-width: 500px;">

      <!-- Nút đóng / Close button -->
      <button class="close-btn-white" onclick="closeUserCommentsModal()"><i class="fas fa-times"></i></button>

      <!-- ── HEADER GRADIENT TÍM-HỒNG / PURPLE-PINK GRADIENT HEADER ── -->
      <div class="modal-header-gradient" style="background: linear-gradient(135deg, #8b5cf6, #db2777);">
        <h3 class="modal-title-fancy">💬 Lịch sử bình luận</h3>
        <!-- Hiển thị tên người dùng / Shows username -->
        <p id="commentUserTitle" style="font-size: 13px; opacity: 0.9; margin-top: 4px;">của user ...</p>
      </div>

      <!-- ── DANH SÁCH BÌNH LUẬN / COMMENTS LIST ──
           Nội dung được nạp qua JavaScript
           Content loaded via JavaScript -->
      <div class="modal-body-fancy">
        <div id="userCommentsList" style="max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
          <!-- Nội dung bình luận render bằng JS / Comment content rendered by JS -->
        </div>
      </div>
    </div>
  </div>

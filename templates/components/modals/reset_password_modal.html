<!-- ======================================================================
     MODAL ĐẶT LẠI MẬT KHẨU / RESET PASSWORD MODAL
     
     Mô tả / Description:
     Modal 2 bước cho phép người dùng đặt lại mật khẩu:
     - Bước 1: Xác minh tài khoản bằng tên đăng nhập + email
     - Bước 2: Nhập mật khẩu mới
     2-step modal allowing users to reset their password:
     - Step 1: Verify account with username + email
     - Step 2: Enter new password
     
     Hàm JS liên quan / Related JS functions:
     - openResetPasswordModal(), closeResetPasswordModal() → auth.js
     - verifyResetAccount(), handleResetPassword() → auth.js
     - backToResetStep1() → auth.js
     ====================================================================== -->
  <div id="resetPasswordModal" class="modal">
    <div class="modal-content-fancy" style="max-width: 400px;">

      <!-- ── HEADER GRADIENT TÍM / PURPLE GRADIENT HEADER ── -->
      <div class="modal-header-gradient" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
          <h3 class="modal-title-fancy">🔐 Đặt lại mật khẩu</h3>
          <div class="close-btn-white" onclick="closeResetPasswordModal()">
              <i class="fas fa-times"></i>
          </div>
      </div>

      <div class="modal-body-fancy" style="padding: 25px 30px;">
          
          <!-- ── BƯỚC 1: XÁC MINH TÀI KHOẢN / STEP 1: ACCOUNT VERIFICATION ──
               Người dùng nhập tên đăng nhập + email để xác minh danh tính
               User enters username + email to verify identity -->
          <div id="resetStep1">
              <!-- Ô nhập tên tài khoản / Username input -->
              <div class="form-group" style="margin-bottom: 15px;">
                  <label class="label-fancy">Tên tài khoản</label>
                  <input type="text" id="resetUsername" class="input-fancy" placeholder="Tên đăng nhập...">
              </div>

              <!-- Ô nhập email đăng ký / Registered email input -->
              <div class="form-group" style="margin-bottom: 20px;">
                  <label class="label-fancy">Email đăng ký</label>
                  <input type="email" id="resetEmail" class="input-fancy" placeholder="Email đã đăng ký...">
              </div>

              <!-- Nút kiểm tra xác minh / Verify button -->
              <button class="btn-save-gradient" onclick="verifyResetAccount()" style="width:100%;">
                  <i class="fas fa-search"></i> Kiểm tra
              </button>
          </div>

          <!-- ── BƯỚC 2: ĐẶT MẬT KHẨU MỚI / STEP 2: SET NEW PASSWORD ──
               Ẩn mặc định, hiển thị sau khi xác minh thành công
               Hidden by default, shown after successful verification -->
          <div id="resetStep2" style="display:none;">
              <form onsubmit="handleResetPassword(); return false;" autocomplete="on">

                <!-- Ô ẩn cho trình quản lý mật khẩu / Hidden field for password managers -->
                <input type="text" name="username" autocomplete="username" style="display:none;">

                <!-- Thông báo xác minh thành công / Verification success alert -->
                <div class="alert-box" style="background:#ecfdf5; color:#047857; padding:10px; border-radius:8px; font-size:13px; margin-bottom:15px;">
                    <i class="fas fa-check-circle"></i> Xin chào <b id="resetUserDisplay"></b>, hãy đặt mật khẩu mới.
                </div>

                <!-- Ô nhập mật khẩu mới / New password input -->
                <div class="form-group">
                    <label class="label-fancy">Mật khẩu mới</label>
                    <input type="password" id="resetNewPass" name="password" class="input-fancy" placeholder="Nhập mật khẩu mới..." autocomplete="new-password">
                </div>

                <!-- Nút đổi mật khẩu / Change password button -->
                <button type="submit" class="btn-save-gradient" style="width:100%; margin-top:10px;">
                    <i class="fas fa-key"></i> Đổi mật khẩu
                </button>

                <!-- Nút quay lại bước 1 / Back to step 1 button -->
                <button type="button" class="btn-cancel" onclick="backToResetStep1()" style="width:100%; margin-top:5px; background:none; color:#666; border:none; font-size:13px;">
                    Quay lại bước 1
                </button>
              </form>
          </div>

          <!-- Vùng thông báo lỗi / Error message area -->
          <p id="resetMsg" style="color:red; font-size:13px; text-align:center; min-height:20px; margin-top:15px; margin-bottom:0;"></p>
      </div>
    </div>
  </div>

<!-- ======================================================================
     MODAL XÁC THỰC / AUTH MODAL
     
     Mô tả / Description:
     Modal đăng nhập và đăng ký tài khoản người dùng.
     Chuyển đổi giữa 2 tab: Đăng nhập (login) và Đăng ký (register).
     User login and registration modal.
     Toggles between 2 tabs: Login and Register.
     
     Hàm JS liên quan / Related JS functions:
     - openAuthModal(), closeAuthModal() → auth.js
     - switchTab(), handleLogin(), handleRegister() → auth.js
     ====================================================================== -->
<div id="authModal" class="modal">
  <div class="modal-content">

    <!-- ── HEADER: TAB CHUYỂN ĐỔI + NÚT ĐÓNG / TABS + CLOSE BUTTON ── -->
    <div class="auth-header-wrapper">
      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">
          Đăng nhập
        </button>
        <button class="tab-btn" onclick="switchTab('register')">Đăng ký</button>
      </div>
      <button class="close-btn-inline" onclick="closeAuthModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- ── FORM ĐĂNG NHẬP / LOGIN FORM ──
         Gồm: Tên đăng nhập + Mật khẩu + Nút đăng nhập + Link quên mật khẩu
         Contains: Username + Password + Login button + Forgot password link -->
    <div id="loginForm" class="auth-form">
      <form
        onsubmit="
          handleLogin();
          return false;
        "
        autocomplete="on"
      >
        <!-- Ô nhập tên đăng nhập / Username input -->
        <div class="form-group">
          <i class="fas fa-user"></i
          ><input
            type="text"
            id="loginUser"
            name="username"
            placeholder="Tên đăng nhập"
            autocomplete="username"
          />
        </div>

        <!-- Ô nhập mật khẩu / Password input -->
        <div class="form-group">
          <i class="fas fa-lock"></i
          ><input
            type="password"
            id="loginPass"
            name="password"
            placeholder="Mật khẩu"
            autocomplete="current-password"
          />
        </div>

        <!-- Nút đăng nhập / Login button -->
        <button type="submit" class="btn-full">Đăng nhập</button>

        <!-- Thông báo lỗi đăng nhập / Login error message -->
        <p
          id="loginMsg"
          style="
            color: red;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
          "
        ></p>

        <!-- Link quên mật khẩu / Forgot password link -->
        <div style="text-align: center; margin-top: 5px">
          <a
            href="#"
            onclick="
              openResetPasswordModal();
              return false;
            "
            style="font-size: 13px; color: #666; text-decoration: none"
            >Quên mật khẩu?</a
          >
        </div>
      </form>
    </div>

    <!-- ── FORM ĐĂNG KÝ / REGISTER FORM ──
         Ẩn mặc định, hiển thị khi chọn tab Đăng ký
         Hidden by default, shown when Register tab is selected -->
    <div id="registerForm" class="auth-form" style="display: none">
      <form
        onsubmit="
          handleRegister();
          return false;
        "
        autocomplete="on"
      >
        <!-- Ô nhập tên đăng nhập mới / New username input -->
        <div class="form-group">
          <i class="fas fa-user"></i
          ><input
            type="text"
            id="regUser"
            name="username"
            placeholder="Chọn tên đăng nhập"
            autocomplete="username"
          />
        </div>

        <!-- Ô nhập mật khẩu / Password input -->
        <div class="form-group">
          <i class="fas fa-lock"></i
          ><input
            type="password"
            id="regPass"
            name="password"
            placeholder="Mật khẩu"
            autocomplete="new-password"
          />
        </div>

        <!-- Checkbox ẩn cho tương thích logic / Hidden checkbox for logic compatibility -->
        <input
          type="checkbox"
          id="regCheck"
          style="display: none"
          checked
          value="Agree"
        />

        <!-- Nút tạo tài khoản / Create account button -->
        <button type="submit" class="btn-full btn-outline">
          Tạo tài khoản
        </button>

        <!-- Thông báo lỗi đăng ký / Register error message -->
        <p
          id="regMsg"
          style="
            color: red;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
          "
        ></p>
      </form>
    </div>
  </div>
</div>
